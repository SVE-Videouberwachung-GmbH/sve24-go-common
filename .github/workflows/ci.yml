name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Schutz gegen Rueckfall: ein Ablauf auf einem GitHub-gehosteten Laeufer
  # haengt wieder an GitHubs Abrechnung — genau daran ist am 2026-08-18 die
  # gesamte Organisation stehengeblieben, ohne dass ein einziger Job startete.
  # Der Fehler faellt hier im Pull Request auf statt erst im Ernstfall.
  self-hosted-only:
    name: Self-hosted runners only
    runs-on: sve24-k8s
    steps:
      - uses: actions/checkout@v4
      - name: No provider-hosted runners
        run: |
          set -euo pipefail
          if grep -rnE "runs-on:\s*(ubuntu|windows|macos)" .github/workflows/; then
            echo "::error::Provider-hosted runner found — use sve24-k8s instead."
            exit 1
          fi
          echo "All workflows run on self-hosted runners."

  go:
    name: Go
    # Eigener Runner im Cluster (sve-cluster, applications/gha-runner-scale-set).
    #
    # Anlass: GitHub hat die Actions-Laeufe dieser Organisation am 2026-08-18
    # wegen der Abrechnung gestoppt — die Jobs starten nicht einmal. Ein
    # eigener Runner verbraucht keine GitHub-Minuten.
    #
    # ACHTUNG BEIM ERGAENZEN VON SCHRITTEN: das Runner-Image ist schlanker als
    # ubuntu-latest. Was dieser Workflow voraussetzt, stellt er sich SELBST
    # bereit (Schritte unten) — nicht ueber ein eigenes Runner-Image.
    #
    # Der Grund ist der Rueckweg: ein Workflow, der stillschweigend von einem
    # bestimmten Image abhaengt, faellt genau dann aus, wenn man auf einen
    # anderen Runner ausweichen muss. So laeuft er unveraendert auch auf
    # ubuntu-latest.
    runs-on: sve24-k8s
    steps:
      - uses: actions/checkout@v4

      # check-latest, damit der Lauf nicht die auf dem Runner vorinstallierte
      # Fassung nimmt: die hinkt regelmaessig ein paar Patch-Staende hinterher
      # und meldet dann stdlib-Schwachstellen, die laengst behoben sind.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: make lint
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...

      # Die Deckung von fuenf Diensten ist hierher gewandert. Ohne diese Klinke
      # waere die Pruefung insgesamt duenner geworden, ohne dass es auffaellt.
      - name: Coverage-Klinke
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.11.4 --config=./.testcoverage.yml

      # Dieses Modul beantwortet die Rechtefrage fuer JEDEN Dienst. Eine
      # Schwachstelle hier ist keine in einer Anwendung, sondern eine im
      # Zugangsschloss des ganzen Oekosystems.
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - run: go build ./...
